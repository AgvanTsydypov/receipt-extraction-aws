[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idp"
version = "0.1.0"
description = "Intelligent document processing on AWS: Textract + Bedrock with field-level evals"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.7",
    "datasets>=2.19",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
